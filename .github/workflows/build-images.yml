name: Build Images

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      REF:
        description: "Build ref (tag, branch or commit SHA)"
        required: false
        default: ""
        type: string
      PROFILE:
        description: "Profile (filename in profiles/ or repository-relative path)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.workflow }}-${{ inputs.REF || github.ref }}-${{ inputs.PROFILE || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build_esp32:
    name: ${{ matrix.board.name }}${{ matrix.variant.name_suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - id: heltec-v3
            name: Heltec V3
            build_target: esp32s3
            make_target: heltec-v3-bins
          - id: heltec-v4
            name: Heltec V4
            build_target: esp32s3
            make_target: heltec-v4-bins
          - id: heltec-wsl3
            name: Heltec WSL3
            build_target: esp32s3
            make_target: heltec-wsl3-bins
        variant:
          - id: standard
            name_suffix: ""
            artifact_suffix: ""
            mqtt: 0
          - id: mqtt
            name_suffix: " MQTT"
            artifact_suffix: -mqtt
            mqtt: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.REF || '' }}
          fetch-depth: 0

      - name: Determine image version
        id: version
        env:
          PROFILE: ${{ inputs.PROFILE || '' }}
        run: |
          echo "version=$(make --no-print-directory -s print-version)" >> "$GITHUB_OUTPUT"
          profile="${PROFILE##*/}" # Remove the directory path.
          profile="${profile%.*}" # Remove the file extension.
          echo "profile_suffix=${profile:+-}${profile// /_}" >> "$GITHUB_OUTPUT"

      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: ${{ matrix.board.build_target }}
          default: false
          ldproxy: false
          override: false

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            platform/esp32/target
          key: ${{ matrix.board.id }}-${{ runner.os }}-${{ hashFiles('platform/esp32/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.board.id }}-${{ runner.os }}-

      - name: Install espflash
        run: cargo install espflash --version 4.4.0 --locked

      - name: Build images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PROFILE: ${{ inputs.PROFILE || '' }}
        run: make VERSION="$VERSION" MQTT=${{ matrix.variant.mqtt }} ${{ matrix.board.make_target }}

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board.id }}${{ steps.version.outputs.profile_suffix }}${{ matrix.variant.artifact_suffix }}-firmware-${{ steps.version.outputs.version }}
          path: dist/*.bin
          if-no-files-found: error

  build_nrf52840:
    name: ${{ matrix.board.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - id: rak4631
            name: RAK4631
            binary: mcrs-rak4631
            uf2_base: "0x26000"
          - id: solar-p1
            name: Solar P1
            binary: mcrs-solar-p1
            uf2_base: "0x27000"
          - id: xiao-nrf52840
            name: XIAO nRF52840
            binary: mcrs-xiao-nrf52840
            uf2_base: "0x27000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.REF || '' }}
          fetch-depth: 0

      # The version the firmware reports (see repeater/build.rs).
      - name: Determine image version
        id: version
        env:
          PROFILE: ${{ inputs.PROFILE || '' }}
        run: |
          echo "version=$(make --no-print-directory -s print-version)" >> "$GITHUB_OUTPUT"
          profile="${PROFILE##*/}" # Remove the directory path.
          profile="${profile%.*}" # Remove the file extension.
          echo "profile_suffix=${profile:+-}${profile// /_}" >> "$GITHUB_OUTPUT"

      - name: Install nRF build tools
        run: |
          rustup target add thumbv7em-none-eabi
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi

      - name: Install legacy DFU packaging tool
        run: pipx install adafruit-nrfutil==0.5.3.post16

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            platform/nrf52840/target
          key: ${{ matrix.board.id }}-${{ runner.os }}-${{ hashFiles('platform/nrf52840/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.board.id }}-${{ runner.os }}-

      - name: Build firmware
        working-directory: platform/nrf52840
        env:
          MCRS_PROFILE: ${{ inputs.PROFILE || '' }}
        run: cargo build --release --locked --bin ${{ matrix.board.binary }}

      - name: Collect image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp "platform/nrf52840/target/thumbv7em-none-eabi/release/${{ matrix.board.binary }}" "dist/${{ matrix.board.binary }}${{ steps.version.outputs.profile_suffix }}-$VERSION.elf"

      - name: Create UF2
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          arm-none-eabi-objcopy -O binary "platform/nrf52840/target/thumbv7em-none-eabi/release/${{ matrix.board.binary }}" "dist/${{ matrix.board.binary }}.bin"
          python3 tools/nrf-uf2.py --base ${{ matrix.board.uf2_base }} "dist/${{ matrix.board.binary }}.bin" "dist/${{ matrix.board.binary }}${{ steps.version.outputs.profile_suffix }}-$VERSION.uf2"

      - name: Create OTA DFU ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Adafruit bootloaders use legacy DFU packages for mobile OTA updates.
          adafruit-nrfutil dfu genpkg --dev-type 0x0052 --application "dist/${{ matrix.board.binary }}.bin" "dist/${{ matrix.board.binary }}${{ steps.version.outputs.profile_suffix }}-$VERSION-dfu-ota.zip"

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board.id }}${{ steps.version.outputs.profile_suffix }}-firmware-${{ steps.version.outputs.version }}
          path: |
            dist/*.elf
            dist/*.uf2
            dist/*.zip
          if-no-files-found: error
