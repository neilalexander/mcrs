name: Build Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: ${{ matrix.board.name }}${{ matrix.variant.name_suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - id: heltec-v3
            name: Heltec V3
            build_target: esp32s3
            make_target: heltec-v3-bins
            artifact_paths: |
              dist/mcrs-heltec-v3-full.bin
              dist/mcrs-heltec-v3-upgrade.bin
              dist/mcrs-heltec-v3-mqtt-full.bin
              dist/mcrs-heltec-v3-mqtt-upgrade.bin
          - id: heltec-v4
            name: Heltec V4
            build_target: esp32s3
            make_target: heltec-v4-bins
            artifact_paths: |
              dist/mcrs-heltec-v4-full.bin
              dist/mcrs-heltec-v4-upgrade.bin
              dist/mcrs-heltec-v4-mqtt-full.bin
              dist/mcrs-heltec-v4-mqtt-upgrade.bin
          - id: heltec-wsl3
            name: Heltec WSL3
            build_target: esp32s3
            make_target: heltec-wsl3-bins
            artifact_paths: |
              dist/mcrs-heltec-wsl3-full.bin
              dist/mcrs-heltec-wsl3-upgrade.bin
              dist/mcrs-heltec-wsl3-mqtt-full.bin
              dist/mcrs-heltec-wsl3-mqtt-upgrade.bin
        variant:
          - id: standard
            name_suffix: ""
            artifact_suffix: ""
            mqtt: 0
          - id: mqtt
            name_suffix: " MQTT"
            artifact_suffix: -mqtt
            mqtt: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: ${{ matrix.board.build_target }}
          default: false
          ldproxy: false
          override: false

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            target
          key: ${{ matrix.board.id }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.board.id }}-${{ runner.os }}-

      - name: Install espflash
        run: cargo install espflash --version 4.4.0 --locked

      - name: Build images
        run: make MQTT=${{ matrix.variant.mqtt }} ${{ matrix.board.make_target }}

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board.id }}${{ matrix.variant.artifact_suffix }}-firmware-${{ github.sha }}
          path: ${{ matrix.board.artifact_paths }}
          if-no-files-found: error
