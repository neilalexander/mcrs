name: Build Images

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      REF:
        description: "Build ref (tag, branch or commit SHA)"
        required: false
        default: ""
        type: string
      PROFILE:
        description: "Profile (filename in profiles/ or repository-relative path)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.workflow }}-${{ inputs.REF || github.ref }}-${{ inputs.PROFILE || '' }}
  cancel-in-progress: true

jobs:
  # One build job for each package in flake.nix: every board, and the Heltec
  # boards again with MQTT. `default` is all the boards together, so it's left
  # out.
  packages:
    name: Packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.REF || '' }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: List packages
        id: packages
        run: |
          packages=$(nix eval --json .#packages.x86_64-linux --apply 'packages: builtins.attrNames (removeAttrs packages [ "default" ])')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.package }}
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.REF || '' }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Fetch what earlier jobs and runs built from mcrs.cachix.org, and push
      # what this job builds. PRs from forks don't get the token, so they only
      # fetch.
      - name: Use Cachix
        uses: cachix/cachix-action@v17
        with:
          name: mcrs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # A profile is an override of the package, which `nix build .#package`
      # can't apply, so the package comes from an expression. It reads the
      # package and profile from the environment, so neither is spliced into it.
      # Builds without a profile go the same way, so every run tests it.
      - name: Build images
        id: build
        env:
          PACKAGE: ${{ matrix.package }}
          PROFILE: ${{ inputs.PROFILE || '' }}
        run: |
          out=$(nix build --print-build-logs --no-link --print-out-paths --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              package = flake.packages.${builtins.currentSystem}.${builtins.getEnv "PACKAGE"};
              profile = builtins.getEnv "PROFILE";
            in
            if profile == "" then package else package.override { inherit profile; }
          ')
          echo "path=$out" >> "$GITHUB_OUTPUT"
          # The store path without its hash: the images' name and version,
          # e.g. mcrs-heltec-v3-mqtt-0.1.3+1a2b3c4d
          echo "name=${out#/nix/store/*-}" >> "$GITHUB_OUTPUT"

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error
