name: Build Images

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      REF:
        description: "Build ref (tag, branch or commit SHA)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.workflow }}-${{ inputs.REF || github.ref }}
  cancel-in-progress: true

jobs:
  # One build job for each package in flake.nix: every board, and the Heltec
  # boards again with MQTT. `default` is all the boards together, so it's left
  # out.
  packages:
    name: Packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.REF || '' }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # flake.lock pins esp-rs-nix to an SSH URL, but runners have no GitHub
      # SSH key. The repository is public, so fetch it over HTTPS instead.
      - name: Fetch flake inputs over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: List packages
        id: packages
        run: |
          packages=$(nix eval --json .#packages.x86_64-linux --apply 'packages: builtins.attrNames (removeAttrs packages [ "default" ])')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.package }}
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.REF || '' }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # flake.lock pins esp-rs-nix to an SSH URL, but runners have no GitHub
      # SSH key. The repository is public, so fetch it over HTTPS instead.
      - name: Fetch flake inputs over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Build images
        id: build
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          out=$(nix build --print-build-logs --no-link --print-out-paths ".#$PACKAGE")
          echo "path=$out" >> "$GITHUB_OUTPUT"
          # The store path without its hash: the images' name and version,
          # e.g. mcrs-heltec-v3-mqtt-0.1.3+1a2b3c4d
          echo "name=${out#/nix/store/*-}" >> "$GITHUB_OUTPUT"

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error
