name: Build Images

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      REF:
        description: "Build ref (tag, branch or commit SHA)"
        required: false
        default: ""
        type: string
      PROFILE:
        description: "Profile (filename in profiles/ or repository-relative path)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.workflow }}-${{ inputs.REF || github.ref }}-${{ inputs.PROFILE || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MCRS_PROFILE: ${{ inputs.PROFILE || '' }}

jobs:
  build_esp32:
    name: ${{ matrix.board.name }}${{ matrix.variant.name_suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - id: heltec-v3
            name: Heltec V3
            make_target: heltec-v3-bins
            package: mcrs-heltec_v3
          - id: heltec-v4
            name: Heltec V4
            make_target: heltec-v3-bins
            package: mcrs-heltec_v4
        variant:
          - id: standard
            name_suffix: ""
            artifact_suffix: ""
            features: ""
          - id: mqtt
            name_suffix: " MQTT"
            artifact_suffix: -mqtt
            # The board crates have no features of their own.
            features: "--features mcrs-esp32s3/mqtt"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.REF || '' }}
          fetch-depth: 0

      - name: Determine image version
        id: version
        run: echo "version=$(make --no-print-directory -s print-version)" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # flake.lock pins esp-rs-nix to an SSH URL, but runners have no GitHub
      # SSH key. The repository is public, so fetch it over HTTPS instead.
      - name: Fetch flake inputs over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      # The toolchain comes from flake.lock, so only reuse build output built by it.
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            platform/esp32/target
          key: ${{ matrix.board.id }}${{ matrix.variant.artifact_suffix }}-${{ runner.os }}-${{ hashFiles('platform/esp32/flake.lock') }}-${{ hashFiles('platform/esp32/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.board.id }}${{ matrix.variant.artifact_suffix }}-${{ runner.os }}-${{ hashFiles('platform/esp32/flake.lock') }}-

      - name: Build firmware
        working-directory: platform/esp32
        run: nix develop --command cargo build --release --locked --bin ${{ matrix.board.package }} ${{ matrix.variant.features }}

      - name: Build images
        working-directory: platform/esp32
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PROFILE: ${{ inputs.PROFILE || '' }}
        run: nix develop --command make VERSION="$VERSION" MQTT=${{ matrix.variant.mqtt }} ${{ matrix.board.make_target }}

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board.id }}${{ matrix.variant.artifact_suffix }}-firmware-${{ steps.version.outputs.version }}
          path: dist/*.bin
          if-no-files-found: error

  build_nrf52840:
    name: nRF52840
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.REF || '' }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # The toolchain comes from flake.lock, so only reuse build output built by it.
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            platform/nrf52840/target
          key: nrf52840-${{ runner.os }}-${{ hashFiles('platform/nrf52840/flake.lock') }}-${{ hashFiles('platform/nrf52840/Cargo.lock') }}
          restore-keys: |
            nrf52840-${{ runner.os }}-${{ hashFiles('platform/nrf52840/flake.lock') }}-

      - name: Build firmware
        working-directory: platform/nrf52840
        run: nix develop --command cargo build --release --locked

      - name: Collect image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp platform/nrf52840/target/thumbv7em-none-eabi/release/mcrs-nrf "dist/nrf52840-$VERSION.elf"

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: nrf52840-firmware-${{ steps.version.outputs.version }}
          path: dist/*.elf
          if-no-files-found: error
