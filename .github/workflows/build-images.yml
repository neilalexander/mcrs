name: Build Images

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      REF:
        description: "Build ref (tag, branch or commit SHA)"
        required: false
        default: ""
        type: string
      PROFILE:
        description: "Profile (filename in profiles/ or repository-relative path)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.workflow }}-${{ inputs.REF || github.ref }}-${{ inputs.PROFILE || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build_esp32:
    name: ${{ matrix.board.name }}${{ matrix.variant.name_suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - id: heltec-v3
            name: Heltec V3
            build_target: esp32s3
            make_target: heltec-v3-bins
          - id: heltec-v4
            name: Heltec V4
            build_target: esp32s3
            make_target: heltec-v4-bins
          - id: heltec-wsl3
            name: Heltec WSL3
            build_target: esp32s3
            make_target: heltec-wsl3-bins
        variant:
          - id: standard
            name_suffix: ""
            artifact_suffix: ""
            mqtt: 0
          - id: mqtt
            name_suffix: " MQTT"
            artifact_suffix: -mqtt
            mqtt: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.REF || '' }}
          fetch-depth: 0

      - name: Determine image version
        id: version
        run: echo "version=$(make --no-print-directory -s print-version)" >> "$GITHUB_OUTPUT"

      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: ${{ matrix.board.build_target }}
          default: false
          ldproxy: false
          override: false

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            target
          key: ${{ matrix.board.id }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.board.id }}-${{ runner.os }}-

      - name: Install espflash
        run: cargo install espflash --version 4.4.0 --locked

      - name: Build images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PROFILE: ${{ inputs.PROFILE || '' }}
        run: make VERSION="$VERSION" MQTT=${{ matrix.variant.mqtt }} ${{ matrix.board.make_target }}

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board.id }}${{ matrix.variant.artifact_suffix }}-firmware-${{ steps.version.outputs.version }}
          path: dist/*.bin
          if-no-files-found: error

  build_nrf52840:
    name: nRF52840
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.REF || '' }}
          fetch-depth: 0

      # The version the firmware reports (see repeater/build.rs).
      - name: Determine image version
        id: version
        run: echo "version=$(make --no-print-directory -s print-version)" >> "$GITHUB_OUTPUT"

      # The toolchain comes from flake.lock, so only reuse build output built by it.
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            firmware/nrf52840/target
          key: nrf52840-${{ runner.os }}-${{ hashFiles('firmware/nrf52840/flake.lock') }}-${{ hashFiles('firmware/nrf52840/Cargo.lock') }}
          restore-keys: |
            nrf52840-${{ runner.os }}-${{ hashFiles('firmware/nrf52840/flake.lock') }}-

      - name: Build firmware
        working-directory: firmware/nrf52840
        run: cargo build --release --locked

      - name: Collect image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp firmware/nrf52840/target/thumbv7em-none-eabi/release/mcrs-nrf "dist/nrf52840-$VERSION.elf"

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: nrf52840-firmware-${{ steps.version.outputs.version }}
          path: dist/*.elf
          if-no-files-found: error
