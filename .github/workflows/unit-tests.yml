name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # flake.lock pins esp-rs-nix to an SSH URL, but runners have no GitHub
      # SSH key. The repository is public, so fetch it over HTTPS instead.
      - name: Fetch flake inputs over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      # The toolchain comes from flake.lock, so only reuse build output built by it.
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            target
          key: unit-tests-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            unit-tests-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      - name: Run unit tests
        run: nix develop --command cargo test --locked

  mqtt:
    name: MQTT
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # flake.lock pins esp-rs-nix to an SSH URL, but runners have no GitHub
      # SSH key. The repository is public, so fetch it over HTTPS instead.
      - name: Fetch flake inputs over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      # The toolchain comes from flake.lock, so only reuse build output built by it.
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            target
          key: mqtt-tests-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            mqtt-tests-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      - name: Run unit tests
        run: nix develop --command cargo test --locked --features mqtt
