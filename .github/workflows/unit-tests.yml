name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Fetch what earlier jobs and runs built from mcrs.cachix.org, and push
      # what this job builds. PRs from forks don't get the token, so they only
      # fetch.
      - name: Use Cachix
        uses: cachix/cachix-action@v17
        with:
          name: mcrs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The toolchain comes from flake.lock, so only reuse build output built by it.
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            target
          key: unit-tests-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            unit-tests-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      # also implicitly/partially tests the dev shell
      - name: Run unit tests
        run: nix develop --command cargo test --locked

  mqtt:
    name: Test (MQTT)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Fetch what earlier jobs and runs built from mcrs.cachix.org, and push
      # what this job builds. PRs from forks don't get the token, so they only
      # fetch.
      - name: Use Cachix
        uses: cachix/cachix-action@v17
        with:
          name: mcrs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The toolchain comes from flake.lock, so only reuse build output built by it.
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            target
          key: mqtt-tests-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            mqtt-tests-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      - name: Run unit tests
        run: nix develop --command cargo test --locked --features mqtt
