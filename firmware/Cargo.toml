[package]
name = "mcrs-firmware"
version = "0.1.0"
edition = "2024"

[features]
mqtt = ["dep:base64", "dep:sha1", "dep:embedded-tls", "dep:rand_core"]
board-heltec-v3 = ["esp32s3", "esp-println/uart"]
board-heltec-v4 = ["esp32s3", "esp-println/jtag-serial", "dep:embedded-io-async-06"]
board-heltec-wsl3 = ["esp32s3", "esp-println/uart"]
esp32 = [
    "dep:embassy-executor",
    "dep:embassy-net",
    "dep:embassy-time",
    "dep:esp-alloc",
    "dep:esp-backtrace",
    "dep:esp-bootloader-esp-idf",
    "dep:esp-hal",
    "dep:esp-rtos",
    "dep:esp-println",
    "dep:esp-rom-sys",
    "dep:esp-radio",
    "esp-backtrace/esp32",
    "esp-backtrace/custom-halt",
    "esp-bootloader-esp-idf/esp32",
    "esp-backtrace/panic-handler",
    "esp-backtrace/println",
    "esp-hal/esp32",
    "esp-hal/unstable",
    "esp-rtos/esp32",
    "esp-println/esp32",
    "esp-println/uart",
    "esp-radio/esp32",
]
esp32s3 = [
    "dep:embassy-executor",
    "dep:embassy-net",
    "dep:embassy-time",
    "dep:esp-alloc",
    "dep:esp-backtrace",
    "dep:esp-bootloader-esp-idf",
    "dep:esp-hal",
    "dep:esp-rtos",
    "dep:esp-println",
    "dep:esp-rom-sys",
    "dep:esp-radio",
    "esp-backtrace/esp32s3",
    "esp-backtrace/custom-halt",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-backtrace/panic-handler",
    "esp-backtrace/println",
    "esp-hal/esp32s3",
    "esp-hal/unstable",
    "esp-rtos/esp32s3",
    "esp-println/esp32s3",
    "esp-radio/esp32s3",
]

[dependencies]
aes = { version = "0.9.3", default-features = false }
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize", "hazmat"] }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
# esp-hal USB uses 0.6; embassy-net uses 0.7.
embedded-io-async-06 = { package = "embedded-io-async", version = "0.6.1", optional = true }
critical-section = "1.2.0"
embassy-executor = { version = "0.10.0", optional = true }
embassy-net = { version = "0.9.1", default-features = false, features = ["dhcpv4", "dns", "medium-ethernet", "proto-ipv4", "tcp", "udp"], optional = true }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", optional = true }
esp-alloc = { version = "0.10.0", default-features = false, features = ["global-allocator", "compat"], optional = true }
embedded-storage = "0.3.1"
littlefs-rust = { package = "littlefs2-rust", version = "0.1.1", default-features = false }
esp-backtrace = { version = "0.20.0", optional = true }
# 0.6 pulls in esp-storage for HAL 1.2; keep this aligned with the stable radio stack.
esp-bootloader-esp-idf = { version = "0.5.0", default-features = false, optional = true }
# esp-radio 0.18 and esp-rtos 0.3 require the HAL 1.1 series.
esp-hal = { version = "~1.1.2", optional = true }
esp-rtos = { version = "0.3.0", default-features = false, features = ["embassy", "esp-radio", "esp-alloc"], optional = true }
esp-println = { version = "0.18.0", default-features = false, optional = true }
esp-rom-sys = { version = "0.1.5", optional = true }
esp-radio = { version = "0.18.0", default-features = false, features = ["wifi", "esp-alloc", "unstable"], optional = true }
hmac = { version = "0.13", default-features = false }
lora-phy = "3.0.1"
mcrs-protocol = { path = "../protocol" }
nb = "1.1.0"
sha2 = { version = "0.11", default-features = false }
static_cell = "2.1.1"

# MQTT WebSocket framing and TLS 1.3 (only in MQTT builds).
base64 = { version = "0.23.1", default-features = false, features = ["alloc"], optional = true }
sha1 = { version = "0.11", default-features = false, optional = true }
embedded-tls = { version = "0.19", default-features = false, optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }
