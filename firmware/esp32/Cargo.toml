# MQTT reporting, WebSocket framing and TLS 1.3 (only in MQTT builds).
base64 = { version = "0.23.1", default-features = false, features = ["alloc"], optional = true }
sha1 = { version = "0.11", default-features = false, optional = true }
embedded-tls = { version = "0.19", default-features = false, optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }
time = { version = "0.3.55", default-features = false, optional = true }
