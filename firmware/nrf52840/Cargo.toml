[package]
name = "mcrs-nrf"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-futures = { version = "0.1.2" }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-nrf = { version = "0.11.0", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "time",
    "nfc-pins-as-gpio",
] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

lora-phy = { git = "https://github.com/lora-rs/lora-rs.git", rev = "d66b4a3", features = ["defmt-03"] }
mcrs-protocol = { path = "../../protocol" }
embedded-hal-bus = { version = "0.3.0", features = ["async", "defmt-03"] }
embedded-alloc = "0.7.0"

[profile.release]
debug = 2
