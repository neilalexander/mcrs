[package]
name = "mcrs-nrf"
version = "0.1.3"
edition = "2024"

[dependencies]
mcrs-repeater = { path = "../../repeater" }

embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-nrf = { version = "0.11.0", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "time",
    "nfc-pins-as-gpio",
] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# The release mcrs-repeater uses: its SX1262 board settings are lora-phy types.
# todo remove this dep
lora-phy = { git = "https://github.com/lora-rs/lora-rs", rev = "15332dab3b4dd39d809990b712cf3ce1f73b14a9" }
embedded-hal-bus = { version = "0.3.0", features = ["async", "defmt-03"] }
embedded-alloc = "0.7.0"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
