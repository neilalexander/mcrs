[package]
name = "mcrs-esp32s3"
version = "0.1.3"
edition = "2024"

[features]
mqtt = ["dep:rand_core", "mcrs-repeater/mqtt"]

[dependencies]
mcrs-repeater = { path = "../../repeater" }

# esp-radio 0.18 and esp-rtos 0.3 require the HAL 1.1 series.
esp-hal = { version = "1.1.2", features = ["esp32s3", "unstable", "defmt"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "esp-radio", "esp-alloc", ] }
esp-alloc = { version = "0.10.0", features = ["global-allocator", "compat"] }
# Keep the bootloader aligned with the stable HAL/radio stack.
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0",features = ["esp32s3", "defmt",  "custom-halt", "panic-handler"] }
esp-println = { version = "0.18.0",  features = ["esp32s3", "defmt-espflash", ] }
esp-rom-sys = { version = "0.1.5" }
esp-radio = { version = "0.18.0", features = ["esp32s3", "wifi", "esp-alloc", "unstable", "defmt"] }

embassy-futures = "0.1.1"
embassy-executor = { version = "0.10.0" }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "medium-ethernet", "proto-ipv4", "tcp", "udp", "defmt"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"

defmt = "1.2.0"

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"

littlefs-rust = { package = "littlefs2-rust", version = "0.1.0", default-features = false }
embedded-storage = "0.3.1"
critical-section = "1.2.0"
static_cell = "2.1.1"
nb = "1.1.0"

# Hardware entropy adapter for the optional repeater MQTT client.
rand_core = { version = "0.6", default-features = false, optional = true }

# The Wi-Fi driver requires optimization even in development builds.
[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2

[[bin]]
name = "mcrs-heltec_v3"
path = "../../board/heltec_v3.rs"

[[bin]]
name = "mcrs-heltec_v4"
path = "../../board/heltec_v4.rs"

[[bin]]
name = "mcrs-heltec_wsl3"
path = "../../board/heltec_wsl3.rs"

[workspace]
resolver = "3"
