[package]
name = "mcrs-nrf"
version = "0.2.0"
edition = "2024"

[dependencies]
mcrs-repeater = { path = "../../repeater" }
mcrs-sx1262 = { path = "../peripherals/sx1262" }

embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-nrf = { version = "0.11.0", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "time",
    "nfc-pins-as-gpio",
] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

embedded-hal-bus = { version = "0.3.0", features = ["async", "defmt-03"] }
embedded-alloc = "0.7.0"
embedded-storage = "0.3.1"
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-futures = "0.1.1"
embedded-io-async = "0.7.0"
littlefs-rust = { package = "littlefs2-rust", version = "0.1.0", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2

[[bin]]
name = "mcrs-rak4631"
path = "../../board/rak4631.rs"

[[bin]]
name = "mcrs-xiao-nrf52840"
path = "../../board/xiao-nrf52840.rs"

[[bin]]
name = "mcrs-solar-p1"
path = "../../board/solar-p1.rs"

[workspace]
resolver = "3"
