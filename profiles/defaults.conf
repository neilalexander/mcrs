# MCRS base image defaults. Network files use the same keys and override these.
# The identity and its derived node name are generated separately per device.
version=1
identity.lat=
identity.lon=
owner.info=
remote.password=meshcore
wifi.ssid=
wifi.pass=
wifi.telnet=false
radio.frequency_hz=869618000
radio.bandwidth_hz=62500
radio.spreading_factor=8
radio.coding_rate=6
radio.tx_power_dbm=14
radio.duty_cycle_percent=10
region.capture=false
flood.max.unscoped=5
flood.max.advert=3
loop.detect=minimal
path.hash.mode=2

# MQTT defaults are ignored in builds without MQTT support.
mqtt.1.host=
mqtt.1.port=1883
mqtt.1.username=
mqtt.1.password=
mqtt.1.auth=password
mqtt.1.auth.audience=
mqtt.1.topic.root=meshcore/{IATA}/{PUBLIC_KEY}/packets
mqtt.1.iata=XXX
mqtt.2.host=
mqtt.2.port=1883
mqtt.2.username=
mqtt.2.password=
mqtt.2.auth=password
mqtt.2.auth.audience=
mqtt.2.topic.root=meshcore/{IATA}/{PUBLIC_KEY}/packets
mqtt.2.iata=XXX
mqtt.3.host=
mqtt.3.port=1883
mqtt.3.username=
mqtt.3.password=
mqtt.3.auth=password
mqtt.3.auth.audience=
mqtt.3.topic.root=meshcore/{IATA}/{PUBLIC_KEY}/packets
mqtt.3.iata=XXX
